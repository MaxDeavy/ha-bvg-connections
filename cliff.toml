# git-cliff configuration (https://git-cliff.org).
# Used by scripts/release.py to generate the CHANGELOG.md section of a release
# from Conventional Commits. Run locally, never from a bot.

[changelog]
header = ""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/MaxDeavy/ha-bvg-connections/compare/{{ previous.version }}...{{ version }}) – {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unveröffentlicht / Unreleased]
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{%- endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Neu / Added" },
  { message = "^fix\\(security\\)", group = "<!-- 4 -->Sicherheit / Security" },
  { message = "^fix", group = "<!-- 2 -->Behoben / Fixed" },
  { message = "^perf", group = "<!-- 1 -->Geändert / Changed" },
  { message = "^refactor", group = "<!-- 1 -->Geändert / Changed" },
  { message = "^revert", group = "<!-- 3 -->Entfernt / Removed" },
  { message = "^docs", group = "<!-- 5 -->Dokumentation / Docs" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|test|style)", skip = true },
]
