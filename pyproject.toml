[project]
name = "ha-bvg-connections"
version = "0.1.4"
description = "Home Assistant integration for BVG/VBB journeys and departure boards"
license = "MIT"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.bvg_connections --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "D"]
ignore = ["D203", "D213", "D401", "E501", "PLR0913", "PLR2004", "PLR0912", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR0915"]
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
