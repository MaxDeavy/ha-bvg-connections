name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported version and latest 2026.10 patch release.
          - ha: "2026.10.0"
            phcc: "0.13.371"
          - ha: "2026.10.4"
            phcc: "0.13.375"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Card (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundled card is up to date
        run: git diff --exit-code -- ../custom_components/bvg_connections/frontend/
